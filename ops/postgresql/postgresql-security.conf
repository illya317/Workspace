# Workspace PostgreSQL security profile. RLS is intentionally not managed here.
password_encryption = 'scram-sha-256'
ssl = on
ssl_cert_file = '/etc/postgresql/16/main/tls/current/server.crt'
ssl_key_file = '/etc/postgresql/16/main/tls/current/server.key'
ssl_min_protocol_version = 'TLSv1.2'
ssl_prefer_server_ciphers = on

log_connections = on
log_disconnections = on
log_lock_waits = on
deadlock_timeout = '1s'
log_line_prefix = '%m [%p] db=%d,user=%u,app=%a,client=%h '

# Do not record statement text, bind parameters, or slow-query literals globally.
log_statement = 'none'
log_duration = off
log_min_duration_statement = -1
log_statement_sample_rate = 0
log_transaction_sample_rate = 0
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_min_error_statement = 'panic'

client_connection_check_interval = '10s'
