name: workspace-dev-secure

x-service-logging: &service-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:15-bookworm
    container_name: workspace-dev-db
    restart: unless-stopped
    entrypoint: ["/workspace-dev/start-db.sh"]
    command:
      - postgres
      - -c
      - hba_file=/var/lib/postgresql/tls/private/pg_hba.conf
      - -c
      - ident_file=/var/lib/postgresql/tls/private/pg_ident.conf
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - ssl_ca_file=/var/lib/postgresql/tls/ca.crt
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_lock_waits=on
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_duration_sample=-1
      - -c
      - log_statement_sample_rate=0
      - -c
      - log_transaction_sample_rate=0
      - -c
      - log_duration=off
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_error_verbosity=terse
      - -c
      - log_line_prefix=%m [%p] db=%d,user=%u,app=%a,client=%h
    environment:
      POSTGRES_DB: workspace_dev
      POSTGRES_USER: workspace_dev
      POSTGRES_PASSWORD_FILE: /var/lib/postgresql/tls/private/postgres_admin_password
    secrets:
      - postgres_admin_password
      - workspace_dev_runtime_password
      - workspace_dev_migrator_password
      - workspace_dev_backup_password
      - workspace_dev_monitor_password
      - postgres_ca
      - postgres_server_cert
      - postgres_server_key
    volumes:
      - workspace-dev-postgres-data:/var/lib/postgresql/data
      - ./start-db.sh:/workspace-dev/start-db.sh:ro
      - ./roles-and-grants.sql:/workspace-dev/bootstrap/roles-and-grants.sql:ro
      - ./pg_hba.conf:/workspace-dev/bootstrap/pg_hba.conf:ro
      - ./pg_ident.conf:/workspace-dev/bootstrap/pg_ident.conf:ro
    tmpfs:
      - /var/lib/postgresql/tls:size=1m,mode=0700
      - /docker-entrypoint-initdb.d:size=1m,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace_dev -d workspace_dev"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    networks:
      - workspace-dev-db-internal
    logging: *service-logging

  app:
    image: node:24-bookworm
    container_name: workspace-dev
    restart: unless-stopped
    init: true
    user: "1000:1000"
    working_dir: /workspace
    command: ["/bin/bash", "/workspace-dev/start-app.sh"]
    env_file:
      - ./app.env
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_BASE_PATH: /test
      ALLOWED_DEV_ORIGINS: fh-bio.cn,www.fh-bio.cn
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_ca
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"
    secrets:
      - workspace_dev_runtime_password
      - postgres_ca
    volumes:
      - ${WORKSPACE_DEV_SOURCE_DIR:?set WORKSPACE_DEV_SOURCE_DIR}:/workspace
      - ${WORKSPACE_DEV_RUNTIME_DIR:?set WORKSPACE_DEV_RUNTIME_DIR}:/workspace-runtime
      - ./app.env:/workspace/.env:ro
      - ./app.env:/workspace-runtime/.env:ro
      - ./install-node-deps.sh:/workspace-dev/install-node-deps.sh:ro
      - ./render-database-url.mjs:/workspace-dev/render-database-url.mjs:ro
      - ./start-app.sh:/workspace-dev/start-app.sh:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/test/login').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 300s
    mem_limit: 10g
    cpus: 3.0
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
    networks:
      - workspace-dev-db-internal
      - workspace-dev-edge
    logging: *service-logging

  migrate:
    image: node:24-bookworm
    profiles: ["migration"]
    restart: "no"
    init: true
    user: "1000:1000"
    working_dir: /workspace
    command: ["/bin/bash", "/workspace-dev/migrate-app.sh"]
    environment:
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgres_ca
      PGOPTIONS: -c role=workspace_dev_owner
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - workspace_dev_migrator_password
      - postgres_ca
    volumes:
      - ${WORKSPACE_DEV_SOURCE_DIR:?set WORKSPACE_DEV_SOURCE_DIR}:/workspace
      - ./install-node-deps.sh:/workspace-dev/install-node-deps.sh:ro
      - ./migrate-app.sh:/workspace-dev/migrate-app.sh:ro
      - ./post-migrate-grants.sql:/workspace-dev/post-migrate-grants.sql:ro
      - ./render-database-url.mjs:/workspace-dev/render-database-url.mjs:ro
    networks:
      - workspace-dev-db-internal
      - workspace-dev-edge
    logging: *service-logging

  verify:
    image: postgres:15-bookworm
    profiles: ["verify"]
    restart: "no"
    entrypoint: ["/bin/bash", "/workspace-dev/verify.sh"]
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - workspace_dev_runtime_password
      - workspace_dev_migrator_password
      - workspace_dev_backup_password
      - workspace_dev_monitor_password
      - postgres_ca
    volumes:
      - ./verify.sh:/workspace-dev/verify.sh:ro
      - ./verify.sql:/workspace-dev/verify.sql:ro
      - ./verify-shadow.sql:/workspace-dev/verify-shadow.sql:ro
    networks:
      - workspace-dev-db-internal

  backup:
    image: postgres:15-bookworm
    profiles: ["backup"]
    restart: "no"
    user: "1000:1001"
    entrypoint: ["/bin/bash", "/workspace-dev/backup-hook.sh"]
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - workspace_dev_backup_password
      - postgres_ca
    volumes:
      - ${WORKSPACE_DEV_BACKUP_DIR:?set WORKSPACE_DEV_BACKUP_DIR}:/backups
      - ./backup-hook.sh:/workspace-dev/backup-hook.sh:ro
      - ./rotate-backups.sh:/workspace-dev/rotate-backups.sh:ro
      - ./security-inventory.sql:/workspace-dev/security-inventory.sql:ro
    networks:
      - workspace-dev-db-internal

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password
  workspace_dev_runtime_password:
    file: ./secrets/workspace_dev_runtime_password
  workspace_dev_migrator_password:
    file: ./secrets/workspace_dev_migrator_password
  workspace_dev_backup_password:
    file: ./secrets/workspace_dev_backup_password
  workspace_dev_monitor_password:
    file: ./secrets/workspace_dev_monitor_password
  postgres_ca:
    file: ./tls/ca.crt
  postgres_server_cert:
    file: ./tls/server.crt
  postgres_server_key:
    file: ./tls/server.key

volumes:
  workspace-dev-postgres-data:
    name: workspace-dev-postgres-data

networks:
  workspace-dev-db-internal:
    name: workspace-dev-db-internal
    internal: true
    ipam:
      config:
        - subnet: 172.29.31.0/24
  workspace-dev-edge:
    name: workspace-dev-edge
    external: true
