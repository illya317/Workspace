cnb-release:
  # 默认分支只保留拒绝直接触发的占位任务。生产脚本会把经 review 的
  # ops/cnb-release.yml 注入 cnb-release 分支，再以 api_trigger_manual 启动。
  api_trigger_manual:
    - name: reject-direct-trigger
      docker:
        image: node:24-bookworm
      stages:
        - name: use-release-entry
          script: |
            echo "[错误] 请从已提交源码运行 ops/publish.sh deploy；默认分支不直接部署。"
            exit 1
