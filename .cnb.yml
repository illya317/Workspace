cnb-release:
  # 关闭 GitHub 镜像同步后的自动部署；手动触发用 api_trigger_manual。
  # 本文件只保留公开流水线形状。真实 CNB env import 地址和部署目标值
  # 在私有 ops ($PRIVATE_OPS_DIR/cnb.yml) 中维护，发布脚本会把真实配置
  # 注入到 cnb-release 分支后再推送到 CNB。
  api_trigger_manual:
    - name: deploy-prod
      docker:
        image: node:22-bookworm
      imports:
        - https://cnb.cool/<owner>/<env-repo>/-/blob/main/server-prod.yaml
      stages:
        - name: install-deploy-tools
          script: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-client rsync ca-certificates python3
        - name: install-node-deps
          script: |
            npm ci --no-audit --fund=false --loglevel=error
        - name: validate-deploy-input
          script: |
            if [ "${RUN_LOCAL_CHECKS:-1}" = "0" ]; then
              echo "==> 跳过部署前校验（RUN_LOCAL_CHECKS=0）"
              exit 0
            fi
            npm run deploy:preflight:ci
        - name: deploy-to-server
          # CNB 的 stage 级 import 作用域与流水线级 import 分开声明。
          # 发布时私有 ops/cnb.yml 会替换这里的占位地址和空目录值。
          imports:
            - https://cnb.cool/<owner>/<env-repo>/-/blob/main/server-prod.yaml
          env:
            REMOTE_DIR: ""
            REMOTE_WORKSPACE_CONFIG_DIR: ""
            INSTALL_LIBRARY_RUNTIME_DEPS: "1"
          script: |
            missing=0
            for key in SERVER REMOTE_DIR REMOTE_WORKSPACE_CONFIG_DIR KEY_CONTENT; do
              if [ -z "$(eval "printf '%s' \"\${$key:-}\"")" ]; then
                echo "[错误] 缺少部署环境变量: $key"
                missing=1
              fi
            done
            if [ "$missing" = "1" ]; then
              echo "[提示] 请检查私有 CNB env import 的 allow_slugs / allow_events / allow_branches 是否允许当前仓库、api_trigger_manual 和 cnb-release。"
              exit 1
            fi
            bash ./ops/deploy.sh
