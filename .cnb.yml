main:
  pull_request:
    - name: required-ci
      runner:
        cpus: 16
      docker:
        build:
          dockerfile: ops/cnb-ci-cache.Dockerfile
          by:
            - .node-version
            - package.json
            - package-lock.json
            - ops/cnb-ci-cache.Dockerfile
            - vendor/sheetjs/PROVENANCE.md
            - vendor/sheetjs/xlsx-0.20.3.tgz
          versionBy:
            - .node-version
            - package-lock.json
            - ops/cnb-ci-cache.Dockerfile
            - vendor/sheetjs/PROVENANCE.md
            - vendor/sheetjs/xlsx-0.20.3.tgz
          sync: "true"
        volumes:
          - main:/workspace/.next/cache:copy-on-write-read-only
          - main:/workspace/.cache/eslint:copy-on-write-read-only
          - main:/workspace/.cache/types:copy-on-write-read-only
          - main:/workspace/.cache/tsbuild:copy-on-write-read-only
      env:
        CI: "true"
        NEXTAUTH_SECRET: workspace-cnb-ci-test-secret
        DATABASE_URL: postgresql://workspace:workspace@127.0.0.1:5432/workspace_ci
        DIRECT_URL: postgresql://workspace:workspace@127.0.0.1:5432/workspace_ci
        SHADOW_DATABASE_URL: postgresql://workspace:workspace@127.0.0.1:5432/workspace_ci_shadow
        WORKSPACE_CONFIG_DIR: /workspace/scripts/check/fixtures/tenant-workspace
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      stages:
        - name: verify-clean-committed-checkout
          script: bash ./ops/cnb-ci.sh checkout
        - name: restore-dependencies
          script: |
            test ! -e node_modules
            ln -s /opt/workspace-deps/node_modules node_modules
            test -x node_modules/.bin/next
            test -x node_modules/.bin/playwright
        - name: setup-ci-services
          script: bash ./ops/cnb-ci.sh setup
        - name: collect-all-independent-errors
          jobs:
            static-policy:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane static-policy
            static-domain:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane static-domain
            static-ui:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane static-ui
            static-lint:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane static-lint
            node-0:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane node-0
            node-1:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane node-1
            node-2:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane node-2
            node-3:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane node-3
            typecheck:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane typecheck
            build:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane build
            database:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane database
        - name: exact-build-e2e
          allowFailure: true
          script: bash ./ops/cnb-ci.sh lane e2e
        - name: required-summary
          script: bash ./ops/cnb-ci.sh summary

  push:
    - name: build-and-deploy-exact-image
      lock:
        key: main-cnb-delivery-cache
        expires: 3600
        wait: true
        timeout: 3600
      runner:
        cpus: 16
      services:
        - name: docker
          options:
            rootlessBuildkitd:
              enabled: true
      docker:
        build:
          dockerfile: ops/cnb-ci-cache.Dockerfile
          by:
            - .node-version
            - package.json
            - package-lock.json
            - ops/cnb-ci-cache.Dockerfile
            - vendor/sheetjs/PROVENANCE.md
            - vendor/sheetjs/xlsx-0.20.3.tgz
          versionBy:
            - .node-version
            - package-lock.json
            - ops/cnb-ci-cache.Dockerfile
            - vendor/sheetjs/PROVENANCE.md
            - vendor/sheetjs/xlsx-0.20.3.tgz
          sync: "true"
        volumes:
          - main:/workspace/.next/cache:read-write
          - main:/workspace/.cache/eslint:read-write
          - main:/workspace/.cache/types:read-write
          - main:/workspace/.cache/tsbuild:read-write
      imports:
        - https://cnb.cool/illya317/env/-/blob/main/server-prod.yaml
      env:
        CI: "true"
        NEXTAUTH_SECRET: workspace-cnb-ci-test-secret
        DATABASE_URL: postgresql://workspace:workspace@127.0.0.1:5432/workspace_ci
        DIRECT_URL: postgresql://workspace:workspace@127.0.0.1:5432/workspace_ci
        SHADOW_DATABASE_URL: postgresql://workspace:workspace@127.0.0.1:5432/workspace_ci_shadow
        WORKSPACE_CONFIG_DIR: /workspace/scripts/check/fixtures/tenant-workspace
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        PRODUCTION_IMAGE_DEPLOY_ENABLED: "1"
        REMOTE_DIR: /home/ubuntu/workspace
        HEALTHCHECK_URL: http://127.0.0.1:3000/workspace/api/internal/health
      stages:
        - name: verify-clean-committed-checkout
          script: bash ./ops/cnb-ci.sh checkout
        - name: restore-dependencies
          script: |
            test ! -e node_modules
            ln -s /opt/workspace-deps/node_modules node_modules
            test -x node_modules/.bin/next
            test -x node_modules/.bin/playwright
        - name: setup-ci-services
          script: bash ./ops/cnb-ci.sh setup
        - name: collect-all-independent-errors
          jobs:
            static-policy:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane static-policy
            static-domain:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane static-domain
            static-ui:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane static-ui
            static-lint:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane static-lint
            node-0:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane node-0
            node-1:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane node-1
            node-2:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane node-2
            node-3:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane node-3
            typecheck:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane typecheck
            build:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane build
            database:
              allowFailure: true
              script: bash ./ops/cnb-ci.sh lane database
        - name: exact-build-e2e
          allowFailure: true
          script: bash ./ops/cnb-ci.sh lane e2e
        - name: required-summary
          script: bash ./ops/cnb-ci.sh summary
        - name: publish-cnb-image-once
          script: bash ./ops/cnb-release.sh build
        - name: verify-cnb-image-digest
          script: bash ./ops/cnb-release.sh verify
        - name: deploy-and-rollback-rehearsal
          script: bash ./ops/cnb-release.sh rehearsal
        - name: deploy-production
          script: bash ./ops/cnb-release.sh production

  api_trigger_deploy:
    - name: deploy-approved-existing-image
      lock:
        key: main-cnb-delivery-cache
        expires: 3600
        wait: true
        timeout: 3600
      runner:
        cpus: 4
      services:
        - name: docker
      docker:
        build:
          dockerfile: ops/cnb-ci-cache.Dockerfile
          by:
            - .node-version
            - package.json
            - package-lock.json
            - ops/cnb-ci-cache.Dockerfile
          versionBy:
            - .node-version
            - package-lock.json
            - ops/cnb-ci-cache.Dockerfile
          sync: "true"
      imports:
        - https://cnb.cool/illya317/env/-/blob/main/server-prod.yaml
      env:
        PRODUCTION_IMAGE_DEPLOY_ENABLED: "1"
        REMOTE_DIR: /home/ubuntu/workspace
        HEALTHCHECK_URL: http://127.0.0.1:3000/workspace/api/internal/health
      stages:
        - name: deploy-approved-existing-image-only
          script: bash ./ops/cnb-release.sh deploy-existing

$:
  tag_deploy.production:
    - name: rollback-known-good-image
      docker:
        image: node:24-bookworm
      imports:
        - https://cnb.cool/illya317/env/-/blob/main/server-prod.yaml
      env:
        PRODUCTION_IMAGE_DEPLOY_ENABLED: "1"
        REMOTE_DIR: /home/ubuntu/workspace
        HEALTHCHECK_URL: http://127.0.0.1:3000/workspace/api/internal/health
      stages:
        - name: install-deploy-tools
          script: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl openssh-client python3
        - name: rollback
          script: bash ./ops/rollback-image.sh
