main:
  api_trigger_rehearsal:
    - name: rehearse-exact-image
      services:
        - docker
      docker:
        image: docker:27-cli
      stages:
        - name: install-deploy-tools
          script: apk add --no-cache bash ca-certificates curl openssh-client python3 rsync skopeo
        - name: mirror-exact-image
          script: bash ./ops/cnb-image-release.sh prepare
        - name: deploy-and-rollback-rehearsal
          script: bash ./ops/cnb-image-release.sh rehearsal

  api_trigger_deploy:
    - name: deploy-exact-image
      services:
        - docker
      docker:
        image: docker:27-cli
      imports:
        - https://cnb.cool/illya317/env/-/blob/main/server-prod.yaml
      stages:
        - name: install-deploy-tools
          script: apk add --no-cache bash ca-certificates curl openssh-client python3 rsync skopeo
        - name: mirror-exact-image
          script: bash ./ops/cnb-image-release.sh prepare
        - name: deploy-production
          script: bash ./ops/cnb-image-release.sh production

$:
  tag_deploy.production:
    - name: rollback-known-good-image
      services:
        - docker
      docker:
        image: docker:27-cli
      imports:
        - https://cnb.cool/illya317/env/-/blob/main/server-prod.yaml
      stages:
        - name: install-deploy-tools
          script: apk add --no-cache bash ca-certificates curl openssh-client python3 rsync
        - name: rollback
          script: bash ./ops/rollback-image.sh
