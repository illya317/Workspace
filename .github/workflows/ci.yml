name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXTAUTH_SECRET: github-actions-ci-secret-2026
  DATABASE_URL: postgresql://workspace:workspace@127.0.0.1:5432/workspace_ci
  DIRECT_URL: postgresql://workspace:workspace@127.0.0.1:5432/workspace_ci
  SHADOW_DATABASE_URL: postgresql://workspace:workspace@127.0.0.1:5432/workspace_ci_shadow
  WORKSPACE_CONFIG_DIR: ${{ github.workspace }}/scripts/check/fixtures/tenant-workspace

jobs:
  changed:
    name: CI / changed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci --no-audit --fund=false --loglevel=error
      - name: Resolve trusted changed range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = pull_request ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base_sha="$(git rev-parse HEAD^)"
          else
            base_sha="$head_sha"
          fi
          git cat-file -e "${base_sha}^{commit}"
          printf 'base=%s\nhead=%s\n' "$base_sha" "$head_sha" >> "$GITHUB_OUTPUT"
      - name: Check changed files and declared dependencies
        env:
          PRISMA_MIGRATION_CHECK_MODE: static
          WORKSPACE_DIFF_BASE: ${{ steps.range.outputs.base }}
          WORKSPACE_DIFF_HEAD: ${{ steps.range.outputs.head }}
        run: npm run check:changed

  node:
    name: CI / node
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci --no-audit --fund=false --loglevel=error
      - run: npm run db:generate
      - run: npm run test:node

  type:
    name: CI / type
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: npm }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/types
            .cache/tsbuild
          key: ${{ runner.os }}-tsc-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-tsc-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --no-audit --fund=false --loglevel=error
      - run: npm run db:generate
      - run: npm run typecheck:full

  postgresql:
    name: CI / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_USER: workspace, POSTGRES_PASSWORD: workspace, POSTGRES_DB: workspace_ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workspace -d workspace_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci --no-audit --fund=false --loglevel=error
      - run: PGPASSWORD=workspace createdb -h 127.0.0.1 -U workspace workspace_ci_shadow
      - run: npm run check:data
      - run: npx prisma migrate deploy --schema=./prisma
      - run: npm run db:seed:resources
      - run: npm run test:integration:postgresql

  build:
    name: CI / build once
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      source_tree: ${{ steps.identity.outputs.source_tree }}
      content_digest: ${{ steps.identity.outputs.content_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: npm }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --no-audit --fund=false --loglevel=error
      - name: Capture exact source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          identity="$(node ops/release/candidate/identity.mjs capture --repository "$GITHUB_WORKSPACE" --revision HEAD)"
          printf 'source_tree=%s\n' "$(jq -r .treeId <<<"$identity")" >> "$GITHUB_OUTPUT"
          printf 'content_digest=%s\n' "$(jq -r .contentDigest <<<"$identity")" >> "$GITHUB_OUTPUT"
      - name: Compile Next exactly once and package the portable runtime
        env:
          NEXT_PUBLIC_BUILD_VERSION: ${{ steps.identity.outputs.content_digest }}
          BUILD_VERSION: ${{ steps.identity.outputs.content_digest }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_SOURCE_TREE: ${{ steps.identity.outputs.source_tree }}
          RELEASE_CONTENT_DIGEST: ${{ steps.identity.outputs.content_digest }}
        run: |
          npm run build
          STANDALONE_SKIP_NEXT_BUILD=1 bash ./ops/build-standalone-artifact.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-runtime-${{ github.sha }}
          path: |
            .next/workspace-standalone.tgz
            .next/workspace-standalone.manifest.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  e2e:
    name: CI / E2E exact build
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_USER: workspace, POSTGRES_PASSWORD: workspace, POSTGRES_DB: workspace_ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workspace -d workspace_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci --no-audit --fund=false --loglevel=error
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workspace-runtime-${{ github.sha }}
          path: .next
      - run: PGPASSWORD=workspace createdb -h 127.0.0.1 -U workspace workspace_ci_shadow
      - run: npx prisma migrate deploy --schema=./prisma
      - run: npm run db:seed:resources
      - run: npx playwright install --with-deps chromium
      - name: Run E2E against the exact packaged build
        env:
          PLAYWRIGHT_STANDALONE_ARCHIVE: .next/workspace-standalone.tgz
          PLAYWRIGHT_STANDALONE_MANIFEST: .next/workspace-standalone.manifest.json
        run: npm run test:e2e:smoke
      - if: ${{ always() }}
        run: npm run playwright:processes:check

  required:
    name: CI / required
    if: ${{ always() }}
    needs: [changed, node, type, postgresql, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every primary lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: test "$(jq '[to_entries[] | select(.value.result != "success")] | length' <<<"$RESULTS")" = 0

  image:
    name: Image / publish exact digest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [required, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.release.outputs.image_ref }}
      image_digest: ${{ steps.release.outputs.image_digest }}
      manifest_url: ${{ steps.manifest_url.outputs.manifest_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workspace-runtime-${{ github.sha }}
          path: .next
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve lowercase registry references
        id: refs
        shell: bash
        run: |
          image_ref="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'image_ref=%s\nmanifest_ref=%s-release\n' "$image_ref" "$image_ref" >> "$GITHUB_OUTPUT"
      - name: Assemble immutable image context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/image-context/runtime .release/image-context/release
          tar -xzf .next/workspace-standalone.tgz -C .release/image-context/runtime
          cp .next/workspace-standalone.tgz .next/workspace-standalone.manifest.json .release/image-context/release/
      - name: Publish the only application image
        id: app_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .release/image-context
          file: ${{ github.workspace }}/ops/image.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.refs.outputs.image_ref }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Generate release.json
        id: release
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.app_image.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="${{ steps.refs.outputs.image_ref }}"
          node ops/image-release-manifest.mjs create \
            --artifact .next/workspace-standalone.tgz \
            --artifact-manifest .next/workspace-standalone.manifest.json \
            --image-ref "$image_ref" --image-digest "$IMAGE_DIGEST" \
            --github-run-id "$GITHUB_RUN_ID" --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output release.json
          mkdir -p .release/manifest-context
          cp release.json .release/manifest-context/release.json
          printf 'image_ref=%s\nimage_digest=%s\n' "$image_ref" "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Publish release.json as an OCI metadata artifact
        id: manifest_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .release/manifest-context
          file: ${{ github.workspace }}/ops/release-manifest.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.refs.outputs.manifest_ref }}:sha-${{ github.sha }}
      - name: Bind metadata URL to its immutable digest
        shell: bash
        env:
          MANIFEST_DIGEST: ${{ steps.manifest_image.outputs.digest }}
        run: echo "manifest_url=docker://${{ steps.refs.outputs.manifest_ref }}@${MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"
        id: manifest_url
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-release-${{ github.sha }}
          path: release.json
          if-no-files-found: error
          retention-days: 90

  cnb:
    name: CNB / dispatch exact digest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CNB_RELEASE_EVENT != '' }}
    needs: [image, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger CNB without exposing the token
        env:
          CNB_TRIGGER_TOKEN: ${{ secrets.CNB_TRIGGER_TOKEN }}
          CNB_RELEASE_EVENT: ${{ vars.CNB_RELEASE_EVENT }}
          SOURCE_TREE: ${{ needs.build.outputs.source_tree }}
          IMAGE_REF: ${{ needs.image.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.image.outputs.image_digest }}
          RELEASE_MANIFEST_URL: ${{ needs.image.outputs.manifest_url }}
        run: |
          set -euo pipefail
          test -n "$CNB_TRIGGER_TOKEN"
          case "$CNB_RELEASE_EVENT" in api_trigger_rehearsal|api_trigger_deploy) ;; *) exit 2 ;; esac
          payload="$(jq -n --arg event "$CNB_RELEASE_EVENT" --arg sha "$GITHUB_SHA" --arg tree "$SOURCE_TREE" \
            --arg image "$IMAGE_REF" --arg digest "$IMAGE_DIGEST" --arg manifest "$RELEASE_MANIFEST_URL" --arg run "$GITHUB_RUN_ID" \
            '{event:$event,branch:"main",sha:$sha,title:("GitHub exact image " + $sha),env:{SOURCE_SHA:$sha,SOURCE_TREE:$tree,IMAGE_REF:$image,IMAGE_DIGEST:$digest,RELEASE_MANIFEST_URL:$manifest,GITHUB_RUN_ID:$run}}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST --url "https://api.cnb.cool/${{ vars.CNB_REPOSITORY || 'illya317/Workspace' }}/-/build/start" \
            --header "Authorization: $CNB_TRIGGER_TOKEN" --header 'Content-Type: application/json' --data "$payload")"
          build_id="$(jq -r '.sn // empty' <<<"$response")"
          log_url="$(jq -r '.buildLogUrl // empty' <<<"$response")"
          test -n "$build_id"
          printf 'CNB build: %s\nCNB log: %s\n' "$build_id" "$log_url"
