name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main, codex/candidate-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    name: CI / changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Use repository Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false --loglevel=error
      - name: Resolve trusted changed range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base_sha="$(git rev-parse HEAD^)"
          else
            base_sha="$head_sha"
          fi
          git cat-file -e "${base_sha}^{commit}"
          printf 'base=%s\nhead=%s\n' "$base_sha" "$head_sha" >> "$GITHUB_OUTPUT"
      - name: Check changed files and their declared dependencies
        env:
          CI: "true"
          WORKSPACE_DIFF_BASE: ${{ steps.range.outputs.base }}
          WORKSPACE_DIFF_HEAD: ${{ steps.range.outputs.head }}
        run: npm run check:changed

  required:
    name: CI / required
    if: always()
    needs: [changed]
    runs-on: ubuntu-latest
    steps:
      - name: Require lightweight changed validation
        env:
          CHANGED_RESULT: ${{ needs.changed.result }}
        run: |
          test "$CHANGED_RESULT" = success
          echo "Changed-file validation passed. Full CI and compilation belong to the single formal release validation."
